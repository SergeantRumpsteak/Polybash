name: Polybash Installer bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Installer kompilieren
        shell: pwsh
        working-directory: installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc polybash_online_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Polybash-Installer
          path: installer/dist/Polybash-Installer.exe
