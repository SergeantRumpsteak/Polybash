name: Polybash Installer bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup installieren
        shell: pwsh
        timeout-minutes: 30
        run: choco install innosetup --no-progress -y

      - name: Installer kompilieren
        shell: pwsh
        working-directory: Polybash/installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc polybash_online_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Polybash-Installer
          path: Polybash/installer/dist/Polybash-Installer.exe

      - name: Installer testen (stiller Einbau, Python-Installation erzwungen, Firewall-Regeln, Ausbau)
        shell: pwsh
        run: |
          function Ann($lvl, $title, $text) {
            $t = ("$text" -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            if ($t.Length -gt 6000) { $t = $t.Substring($t.Length - 6000) }
            Write-Host "::$lvl title=$title::$t"
          }
          function Run($file, $argl, $name) {
            $q = Start-Process $file -ArgumentList $argl -PassThru
            if (-not $q.WaitForExit(300000)) {
              Ann "error" "Haengt: $name" ((Get-Process | Where-Object { $_.ProcessName -match 'python|unins|Polybash|msiexec' } | ForEach-Object { $_.ProcessName }) -join ", ")
              if (Test-Path "$dest\install.log") { Ann "error" "install.log bei $name" ((Get-Content "$dest\install.log" -Tail 15) -join "`n") }
              foreach ($n in "python-repair.log","python-uninstall.log","python-install2.log") { if (Test-Path "$dest\$n") { Ann "error" "$n bei $name" ((Select-String -Path "$dest\$n" -Pattern "Exit code|error|Detect|already|Planned package|Planned related" | Select-Object -Last 25 | ForEach-Object { $_.Line.Substring([Math]::Min(120,$_.Line.Length)) }) -join "`n") } }
              taskkill /F /T /PID $q.Id | Out-Null
              throw "$name haengt (nach 5 Minuten abgebrochen)"
            }
            return $q
          }
          $dest = "$env:RUNNER_TEMP\pbtest"
          $exe = (Resolve-Path "Polybash/installer/dist/Polybash-Installer.exe").Path
          try {
            $p = Run $exe @("/VERYSILENT","/SUPPRESSMSGBOX","/NORESTART","/SP-","/DIR=$dest","/LOG=$env:RUNNER_TEMP\setup.log","/forcepy=1") "Installer-Lauf 1"
            Ann "notice" "Installer-Exitcode" "$($p.ExitCode)"
            $ls = if (Test-Path $dest) { (Get-ChildItem $dest | ForEach-Object { $_.Name }) -join ", " } else { "(Zielordner fehlt)" }
            Ann "notice" "Zielordner" $ls
            foreach ($n in "install.log","python-install.log") {
              if (Test-Path "$dest\$n") { Ann "notice" $n ((Get-Content "$dest\$n" -Tail 40) -join "`n") } else { Ann "warning" $n "fehlt" }
            }
            if (Test-Path "$env:RUNNER_TEMP\setup.log") { Ann "notice" "setup.log (Inno)" ((Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 30) -join "`n") }
            if (-not (Test-Path "$dest\python\python.exe")) { throw "Python wurde nicht installiert" }
            $o = & "$dest\venv\Scripts\python.exe" -c "import panda3d; print('panda3d', panda3d.__version__)" 2>&1
            Ann "notice" "Panda3D" "$o"
            if ($LASTEXITCODE -ne 0) { throw "Panda3D nicht importierbar" }
            if (-not (Test-Path "$dest\venv\Scripts\pythonw.exe")) { throw "venv\Scripts\pythonw.exe fehlt" }
            $r = netsh advfirewall firewall show rule name="Polybash" 2>&1
            Ann "notice" "Firewall-Regeln nach Installation" ($r -join "`n")
            if ($LASTEXITCODE -ne 0) { throw "Firewall-Regeln fehlen" }
            Run "$dest\unins000.exe" @("/VERYSILENT","/SUPPRESSMSGBOX","/NORESTART") "Deinstallation 5" | Out-Null
            netsh advfirewall firewall show rule name="Polybash" | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "Firewall-Regeln wurden beim Deinstallieren nicht entfernt" }
            # zweiter Durchlauf ohne /forcepy: vorhandenes System-Python benutzen, danach Verknuepfungsziel pruefen
            $p = Run $exe @("/VERYSILENT","/SUPPRESSMSGBOX","/NORESTART","/SP-","/DIR=$dest","/LOG=$env:RUNNER_TEMP\setup2.log") "Installer-Lauf 2"
            Ann "notice" "Zweiter Durchlauf (System-Python)" ((Get-Content "$dest\install.log" -Tail 12) -join "`n")
            if (-not (Test-Path "$dest\venv\Scripts\pythonw.exe")) { throw "2. Durchlauf: venv\Scripts\pythonw.exe fehlt" }
            $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Polybash\Polybash.lnk")
            Ann "notice" "Verknuepfung" "Ziel: $($lnk.TargetPath) | Argumente: $($lnk.Arguments) | existiert: $(Test-Path $lnk.TargetPath)"
            if (-not (Test-Path $lnk.TargetPath)) { throw "Ziel der Startmenue-Verknuepfung fehlt: $($lnk.TargetPath)" }
            # dritter Durchlauf: Python-Ordner von Hand loeschen (Windows kennt Python noch) und mit erzwungenem Python neu installieren
            Run "$dest\unins000.exe" @("/VERYSILENT","/SUPPRESSMSGBOX","/NORESTART") "Deinstallation 6" | Out-Null
            $p = Run $exe @("/VERYSILENT","/SUPPRESSMSGBOX","/NORESTART","/SP-","/DIR=$dest","/LOG=$env:RUNNER_TEMP\setup3.log","/forcepy=1") "Installer-Lauf 3"
            Ann "notice" "Dritter Durchlauf (nach Loeschen)" ((Get-Content "$dest\install.log" -Tail 12) -join "`n")
            if (-not (Test-Path "$dest\python\python.exe")) { throw "3. Durchlauf: python.exe fehlt" }
            Remove-Item "$dest\python","$dest\venv" -Recurse -Force
            $p = Run $exe @("/VERYSILENT","/SUPPRESSMSGBOX","/NORESTART","/SP-","/DIR=$dest","/LOG=$env:RUNNER_TEMP\setup4.log","/forcepy=1") "Installer-Lauf 4"
            Ann "notice" "Vierter Durchlauf (Python-Ordner geloescht)" ((Get-Content "$dest\install.log" -Tail 12) -join "`n")
            if (-not (Test-Path "$dest\venv\Scripts\pythonw.exe")) { throw "4. Durchlauf: pythonw.exe fehlt" }
            Run "$dest\unins000.exe" @("/VERYSILENT","/SUPPRESSMSGBOX","/NORESTART") "Deinstallation 7" | Out-Null
            Ann "notice" "Test" "alles in Ordnung"
            $global:LASTEXITCODE = 0
          } catch {
            Ann "error" "Test fehlgeschlagen" "$_"
            exit 1
          }
          exit 0
